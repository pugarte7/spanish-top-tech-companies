name: deploy

# Builds _site/ from companies.csv and publishes it with the MCP server to
# Cloudflare Workers. Every push to main redeploys, so Monday's "Refresh
# salaries" commit is on the site minutes later. Building only reads the CSV,
# so it runs fine on GitHub; fetching from Levels.fyi stays on the Mac.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers"
# template) and CLOUDFLARE_ACCOUNT_ID, and optionally the variable SITE_URL
# (e.g. https://tech-pay-spain.<subdomain>.workers.dev) for absolute links in
# llms.txt. Without the secrets it builds and tests but does not deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build site
        run: python3 scripts/site.py

      - name: Worker answers like mcp_server.py
        run: node worker/test.mjs

      - name: Deploy to Cloudflare Workers
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Not deployed
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; built and tested, not deployed."
