name: deploy

# Builds _site/ from the committed aggregates in data/ and publishes it, with
# the MCP server at /mcp (api/mcp.js), to Vercel. Built here and uploaded
# prebuilt: vercel.json turns off Vercel's own Git deployments so a push is
# deployed once. companies.csv is private and never reaches GitHub; the Mac
# fetches from Levels.fyi and commits data/ (site.py --refresh).
#
# Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
# (the last two from .vercel/project.json after `vercel link`), and
# optionally the variable SITE_URL (e.g. https://tech-pay-spain.vercel.app)
# for absolute links in llms.txt. Without the token it builds and tests but
# does not deploy.
#
# The build also writes /api/v1/jobs.json (vercel.json's buildCommand runs
# scripts/jobs.mjs after site.py); the only thing committed is the pay those
# postings state, to the `offers` branch. The daily schedule
# below crawls the job boards and republishes the same commit with today's
# postings. A push only reuses production's jobs.json while it is under
# JOBS_REUSE_HOURS old, so a code change deploys in minutes.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # 05:17 in Madrid in winter, 06:17 in summer
  workflow_dispatch:

# Deploys queue instead of cancelling each other: a push during the daily
# crawl (up to 45 minutes) used to cancel it, losing the day's postings
# (2026-11-09). A queued push deploy then reuses the fresh index.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write   # the `offers` branch; nothing else is pushed

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      JOBS_REUSE_HOURS: ${{ github.event_name == 'push' && '36' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # The token lifts GitHub's 60-an-hour limit on the star count in the topbar.
      - name: Build site
        if: env.VERCEL_TOKEN == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/site.py

      # zod and fast-xml-parser, which lib/ats needs to crawl the boards.
      - name: Install
        run: npm ci --omit=dev

      - name: Build for Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: /mcp answers
        run: node tests/mcp.test.mjs

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # The pay employers state in their postings, kept day by day:
      # scripts/offers.py merges today's jobs.json into offers.csv on the
      # `offers` branch (one row per posting and range, first and last day
      # seen). Its own branch, so the daily commit neither redeploys the site
      # nor races the Mac's weekly push to main. A failure here is a lost day,
      # never a failed deploy.
      - name: Check out offers
        id: offers
        if: ${{ !cancelled() && hashFiles('_site/api/v1/jobs.json') != '' }}
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: offers
          path: offers-branch

      - name: Record stated pay
        if: ${{ !cancelled() && steps.offers.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 scripts/offers.py _site/api/v1/jobs.json offers-branch/offers.csv
          cd offers-branch
          git add offers.csv
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Offers $(date -u +%F)"
          git push -q origin HEAD:offers

      - name: Not deployed
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN is not set; built and tested, not deployed."
