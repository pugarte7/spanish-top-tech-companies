name: deploy

# Builds _site/ from the committed aggregates in data/ and publishes it, with
# the MCP server at /mcp (api/mcp.js), to Vercel. Built here and uploaded
# prebuilt: vercel.json turns off Vercel's own Git deployments so a push is
# deployed once. companies.csv is private and reaches GitHub only encrypted,
# in a private repo; refresh.yml fetches from Levels.fyi and commits data/.
#
# Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
# (the last two from .vercel/project.json after `vercel link`), optionally
# BROWSERBASE_API_KEY (career sites that challenge the runner), and
# optionally the variable SITE_URL (e.g. https://tech-pay-spain.vercel.app)
# for absolute links in llms.txt. Without the token it builds and tests but
# does not deploy.
#
# The build also writes /api/v1/jobs.json (vercel.json's buildCommand runs
# scripts/jobs.mjs after site.py); the only thing committed is the pay those
# postings state, to the `offers` branch. The daily schedule
# below crawls the job boards and republishes the same commit with today's
# postings. A push only reuses production's jobs.json while it is under
# JOBS_REUSE_HOURS old, so a code change deploys in minutes.

on:
  push:
    branches: [main]
  schedule:
    # GitHub starts this repo's schedules 7 to 9 hours late (04:17 UTC ran between
    # 11:03 and 13:26 UTC every day from 2026-11-05 to 11-17), so it is set for the
    # evening before: late, it lands in the early morning in Madrid; on time, the
    # postings are from that evening.
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      reuse_jobs:
        # refresh.yml's push starts no workflow, so it dispatches this one,
        # and a salary refresh should not wait on a crawl either.
        description: "Reuse production's jobs.json while it is under 36 hours old"
        type: boolean
        default: false

# Deploys queue instead of cancelling each other: a push during the daily
# crawl (some 45 minutes, up to 90) used to cancel it, losing the day's postings
# (2026-11-09). A queued push deploy then reuses the fresh index.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write   # the `offers` branch; nothing else is pushed

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      JOBS_REUSE_HOURS: ${{ (github.event_name == 'push' || inputs.reuse_jobs) && '36' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The token lifts GitHub's 60-an-hour limit on the star count in the topbar.
      - name: Build site
        if: env.VERCEL_TOKEN == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/site.py

      # zod and fast-xml-parser, which lib/ats needs to crawl the boards.
      - name: Install
        run: npm ci --omit=dev

      # The people hiring_contact gives come from the private repo into
      # api/_contacts.json, which vercel.json bundles with the MCP function
      # only (never under _site/) and git ignores. Nothing of it is printed.
      # Without the secrets or the file, hiring_contact is not offered.
      - name: Contacts for hiring_contact
        if: env.VERCEL_TOKEN != ''
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          if [ -z "$DATA_KEY" ] || [ -z "$DATA_DEPLOY_KEY" ]; then
            echo "No private-repo secrets: hiring_contact is off."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DATA_DEPLOY_KEY" > ~/.ssh/data_key
          chmod 600 ~/.ssh/data_key
          ssh-keyscan -q github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/data_key -o IdentitiesOnly=yes"
          export STC_DATA="$RUNNER_TEMP/data/website/companies.csv"
          if bash scripts/private_data.sh contacts api/_contacts.json > /dev/null 2>&1; then
            echo "Contacts read."
          else
            rm -f api/_contacts.json
            echo "::warning::Contacts not read: hiring_contact is off."
          fi

      # Some career sites refuse the runner's address. With BROWSERBASE_API_KEY
      # the crawl reads data/browser-hosts.json through a Browserbase cloud
      # browser and tries there any other host still refusing; without it
      # they fail and keep their last postings for up to a week, as before.
      - name: Build for Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          set -o pipefail
          vercel build --prod --token="$VERCEL_TOKEN" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Summary
        if: ${{ hashFiles('_site/api/v1/jobs.json') != '' }}
        run: python3 scripts/run_summary.py postings _site/api/v1/jobs.json "$RUNNER_TEMP/build.log"

      - name: /mcp answers
        run: node tests/mcp.test.mjs

      # A deploy takes 10-20 seconds. On 2026-11-10 Vercel's side hung for an
      # hour on "Downloading deployment files" and then failed; a rerun went
      # through at once. So each try gets five minutes, and there are three.
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        timeout-minutes: 20
        run: |
          for try in 1 2 3; do
            timeout 300 vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" && exit 0
            echo "::warning::Vercel deploy try $try failed or hung, retrying"
            sleep 30
          done
          exit 1

      # The pay employers state in their postings, kept day by day:
      # scripts/offers.py merges today's jobs.json into offers.csv on the
      # `offers` branch (one row per posting and range, first and last day
      # seen). Its own branch, so the daily commit neither redeploys the site
      # nor races the weekly refresh's push to main. A failure here is a lost day,
      # never a failed deploy.
      - name: Check out offers
        id: offers
        if: ${{ !cancelled() && hashFiles('_site/api/v1/jobs.json') != '' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: offers
          path: offers-branch

      - name: Record stated pay
        if: ${{ !cancelled() && steps.offers.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 scripts/offers.py _site/api/v1/jobs.json offers-branch/offers.csv
          cd offers-branch
          git add offers.csv
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Offers $(date -u +%F)"
          git push -q origin HEAD:offers

      - name: Not deployed
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN is not set; built and tested, not deployed."
