name: release

# One release a week with every PR merged into main since the last tag, one
# bullet each. The biggest label among them sets the bump (major > minor >
# patch, no label is patch). A week with no merged PR makes none.

on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays, after the weekly refresh
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Tag and release the week's PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          git rev-list "${last:+$last..}$sha" > commits.txt
          if [ ! -s commits.txt ]; then
            echo "Nothing new since $last, no release."
            exit 0
          fi

          gh pr list --repo "$REPO" --state merged --base main --limit 300 \
            --json number,title,labels,mergeCommit \
            --jq '.[] | [.mergeCommit.oid, (.number|tostring), ([.labels[].name] | join(",")), .title] | @tsv' \
            | grep -F -f commits.txt | sort -t$'\t' -k2,2n > prs.tsv || true

          if [ ! -s prs.tsv ]; then
            echo "No PR merged since ${last:-the start}, no release."
            exit 0
          fi

          labels=$(cut -f3 prs.tsv | tr ',' '\n')
          IFS=. read -r major minor patch <<<"${last#v}"
          if grep -qx major <<<"$labels"; then next="$((major + 1)).0.0"
          elif grep -qx minor <<<"$labels"; then next="$major.$((minor + 1)).0"
          else next="$major.$minor.$((patch + 1))"; fi

          awk -F'\t' '{ printf "- %s (#%s)\n", $4, $2 }' prs.tsv > notes.md
          gh release create "v$next" --repo "$REPO" --target "$sha" \
            --title "v$next" --notes-file notes.md --latest
