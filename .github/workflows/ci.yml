name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Pipeline regression tests
        run: python3 tests/test_pipeline.py

      - name: Enrichment answers are checked
        run: python3 tests/test_enrich.py

      - name: Company descriptions are checked
        run: python3 tests/test_about.py

      - name: Run history lines
        run: python3 tests/test_run_summary.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install
        run: npm ci --omit=dev

      - name: Site builds and /mcp answers
        run: python3 scripts/site.py && node tests/mcp.test.mjs

      # Offline: the boards are stubbed, the crawl runs only in deploys.
      - name: Job index
        run: node tests/jobs.test.mjs

      # companies.csv is private, so validate.py and site.py --refresh run on
      # the maintainer's Mac (scripts/weekly.sh); CI has the tests and the site,
      # built from the committed aggregates in data/.
