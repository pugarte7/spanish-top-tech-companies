name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly staleness sweep
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    # GitHub's default shell is `bash -e`, with no pipefail. That made the
    # validate step below report success whatever it found, because its exit
    # code was tee's rather than its own - so the guard that keeps another
    # country's salaries out of this dataset could fail and the build stayed
    # green. `shell: bash` is the one that sets -o pipefail.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pipeline regression tests
        run: python3 tests/test_pipeline.py

      - name: Validate every company file
        run: python3 scripts/validate.py | tee validate.log

      - name: Rebuild README and exports
        run: python3 scripts/build.py

      - name: Fail if generated files are out of date
        run: |
          if ! git diff --exit-code -- README.md exports/; then
            echo "::error::README.md or exports/ are stale. Run 'python3 scripts/build.py' and commit the result."
            exit 1
          fi

      - name: Staleness report
        if: always()
        run: |
          {
            echo "### Data health"
            echo
            echo '```'
            grep -E "not verified in over a year|^[0-9]+ companies" validate.log || echo "nothing stale"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
