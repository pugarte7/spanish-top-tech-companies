name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Pipeline regression tests
        run: python3 tests/test_pipeline.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install
        run: npm ci --omit=dev

      - name: Site builds and /mcp answers
        run: python3 scripts/site.py && node tests/mcp.test.mjs

      # Offline: the boards are stubbed, the crawl runs only in deploys.
      - name: Job index
        run: node tests/jobs.test.mjs

      # companies.csv is private, so validate.py and site.py --refresh run on
      # the maintainer's Mac (scripts/weekly.sh); CI has the tests and the site,
      # built from the committed aggregates in data/.
