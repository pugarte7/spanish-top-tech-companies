name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Pipeline regression tests
        run: python3 tests/test_pipeline.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install
        run: npm ci --omit=dev

      - name: Site builds and /mcp answers
        run: python3 scripts/site.py && node tests/mcp.test.mjs

      # Offline: the boards are stubbed, the crawl runs only in deploys.
      - name: Job index
        run: node tests/jobs.test.mjs

      # companies.csv is private, so validate.py and site.py --refresh run on
      # the maintainer's Mac (scripts/weekly.sh); CI has the tests and the site,
      # built from the committed aggregates in data/.
