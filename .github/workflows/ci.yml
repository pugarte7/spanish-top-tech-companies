name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pipeline regression tests
        run: python3 tests/test_pipeline.py

      # companies.csv is private, so validate.py and build.py run on the
      # maintainer's Mac (scripts/weekly.sh); CI has only the tests.
