name: news

# The last thing that happened at each company, in one sentence
# (scripts/news.py): Google News headlines, one picked and restated by a small
# model through OpenRouter. Weekly, and by hand. Commits data/news.json to
# main and asks for a deploy.
#
# Secret: OPENROUTER_API_KEY, an inference key with a credit limit.

on:
  schedule:
    # Tuesdays: the Monday refresh has settled which companies are listed.
    - cron: "30 3 * * 2"
  workflow_dispatch:

concurrency:
  group: news
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # dispatches deploy.yml

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Read the headlines
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          [ -n "$OPENROUTER_API_KEY" ] || { echo "OPENROUTER_API_KEY is not set."; exit 1; }
          status=0
          python3 scripts/news.py > /dev/null 2> "$RUNNER_TEMP/news.log" || status=$?
          cat "$RUNNER_TEMP/news.log"
          python3 scripts/run_summary.py News "$(tail -1 "$RUNNER_TEMP/news.log")"
          exit "$status"

      # A push by the workflow's own token starts no deploy, so it asks for one.
      - name: Commit data/news.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -N data/news.json
          if git diff --quiet -- data/news.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -q -m "Company news $(date -u +%F)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
          echo "data/news.json pushed."
          gh workflow run deploy.yml --ref main -f reuse_jobs=true
