name: refresh

# The Monday salary refresh. Until 2026-11-19 it ran on the maintainer's Mac
# (scripts/weekly.sh, still there to run by hand): Levels.fyi's pages served
# GitHub's runners no data. Since fetch_spain.py reads only the API, which
# answers a runner like it answers the Mac, it runs here.
#
# The private files (companies.csv, global.json, feed.json, usage.csv) come
# encrypted from the private repo pugarte7/spanish-top-tech-companies-data
# (scripts/private_data.sh) and go back there before anything public moves.
# fetch_spain.py reads only what was submitted since each role's cursor in
# feed.json, a quarter of the roles whole every week.
#
# Secrets: LEVELS_EMAIL and LEVELS_PASSWORD (the Levels.fyi account; a runner
# has no Keychain and a secret cannot follow a rotating refresh token, so it
# signs in each run), DATA_KEY (the private files' passphrase) and
# DATA_DEPLOY_KEY (an SSH key with write access to the private repo).
#
# A push with GITHUB_TOKEN starts no other workflow, so this one dispatches
# deploy.yml and opens the week's issue itself (weekly.yml's digest job only
# answers pushes from the Mac).

on:
  schedule:
    # GitHub starts this repo's schedules 7 to 9 hours late (see deploy.yml):
    # set for 01:00 UTC, it lands Monday morning.
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Pull the private data
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          echo "STC_DATA=$RUNNER_TEMP/data/website/companies.csv" >> "$GITHUB_ENV"
          export STC_DATA="$RUNNER_TEMP/data/website/companies.csv"
          mkdir -p ~/.ssh
          printf '%s\n' "$DATA_DEPLOY_KEY" > ~/.ssh/data_key
          chmod 600 ~/.ssh/data_key
          ssh-keyscan -q github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/data_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/data_key -o IdentitiesOnly=yes"
          bash scripts/private_data.sh pull
          cp "$STC_DATA" "$RUNNER_TEMP/before.csv"

      - name: Fetch and rebuild data/
        env:
          LEVELS_EMAIL: ${{ secrets.LEVELS_EMAIL }}
          LEVELS_PASSWORD: ${{ secrets.LEVELS_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The traffic API wants admin rights the workflow token lacks; stars
          # and forks still come through.
          python3 scripts/usage.py || echo "usage failed; usage.csv keeps what it had"
          # The two HTML readers fail from here as from the Mac (the WAF answers
          # 405); the repo's taxonomy and the details on file stand in.
          python3 scripts/fetch_taxonomy.py \
            || echo "fetch_taxonomy failed; keeping scripts/taxonomy.py as it is"
          python3 scripts/fetch_spain.py --delay 3.0
          python3 scripts/fetch_company.py --missing --delay 3.0 \
            || echo "fetch_company failed; company details stay as they are"
          python3 scripts/fetch_radar.py
          python3 tests/test_pipeline.py
          python3 scripts/validate.py
          python3 scripts/site.py --refresh
          python3 scripts/review.py > data/review.md
          { npm ci --omit=dev -q && node scripts/boards.mjs > /dev/null; } \
            || echo "boards failed; data/boards.json stays as it is"

      # Before the public push: feed.json's cursors have moved past this
      # week's rows, so losing the CSV now would lose them for good.
      - name: Push the private data
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/private_data.sh push

      - name: Commit data/, deploy and open the week's issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data scripts/taxonomy.py
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          python3 scripts/digest.py "$RUNNER_TEMP/before.csv" > digest.md
          git commit -q -m "Refresh salaries $(date -u +%F)" -m "$(cat digest.md)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          gh workflow run deploy.yml --ref main -f reuse_jobs=true
          cat digest.md >> "$GITHUB_STEP_SUMMARY"
          gh issue list --state open --limit 100 --json number,title,author \
            --jq '.[] | select(.author.is_bot) | select((.title | startswith("Week of ")) or .title == "No salary refresh this week") | .number' |
            while read -r number; do gh issue close "$number" --reason completed; done
          gh issue create --title "Week of $(date -u +%F)" --body-file digest.md

      - name: Keep "Companies to verify" current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/review.py --limit 200 > verify.md
          number="$(gh issue list --state open --search '"Companies to verify" in:title' \
                    --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file verify.md
          else
            gh issue create --title "Companies to verify" --body-file verify.md
          fi
