name: refresh

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      audit:
        description: "Report what Levels.fyi serves, write nothing"
        type: boolean
        default: false
      companies:
        description: "Levels.fyi slugs, space-separated. Empty: every company on file plus discovery"
        type: string
        default: ""

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    # pipefail, so the fetch step fails when fetch_spain.py does rather than
    # when tee does. See the same note in ci.yml.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Levels.fyi session
        env:
          REFRESH_TOKEN: ${{ secrets.LEVELS_REFRESH_TOKEN }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::error::The LEVELS_REFRESH_TOKEN secret is not set."
            exit 1
          fi
          mkdir -p ~/.config/levels
          install -m 600 /dev/null ~/.config/levels/refresh_token
          printf '%s' "$REFRESH_TOKEN" > ~/.config/levels/refresh_token

      - name: Fetch salaries in Spain
        env:
          AUDIT: ${{ inputs.audit }}
          COMPANIES: ${{ inputs.companies }}
        run: |
          set -f
          args=(--delay 3.0)
          if [ "$AUDIT" = "true" ]; then args+=(--audit); fi
          for slug in $COMPANIES; do args+=(--company "$slug"); done
          python3 scripts/fetch_spain.py "${args[@]}" 2>&1 | tee fetch.log

      - name: Run report
        if: always()
        run: |
          {
            echo "### Run report"
            echo
            echo '```'
            grep -E "^(signed in|no token|served|engineers at|companies):|employers with recent|HTTP|Cognito" fetch.log || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pipeline regression tests
        run: python3 tests/test_pipeline.py

      - name: Validate and rebuild
        run: python3 scripts/validate.py && python3 scripts/build.py

      - name: Commit
        if: ${{ !inputs.audit }}
        run: |
          git add README.md companies.csv
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh salaries $(date -u +%F)"
          git push
