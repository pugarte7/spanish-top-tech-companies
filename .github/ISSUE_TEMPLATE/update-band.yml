name: Add or update a salary
description: A new salary for a company that's already listed, or re-verifying one on file.
title: "Update: "
labels: ["salary data"]
body:
  - type: markdown
    attributes:
      value: |
        Re-verifying a stale salary counts just as much as adding a new one.
        Never include names, teams, or anything that identifies a person.

  - type: input
    id: company
    attributes:
      label: Company
      description: The slug if you know it, otherwise the name.
      placeholder: cabify
    validations: { required: true }

  - type: input
    id: band
    attributes:
      label: Base salary, gross annual, EUR
      description: One software engineer's base salary, 60000 or more.
      placeholder: "72000"
    validations: { required: true }

  - type: input
    id: years
    attributes:
      label: Years of experience
      description: 5 or more. What the company calls the level does not matter.
      placeholder: "8"
    validations: { required: true }

  - type: textarea
    id: source
    attributes:
      label: Source
      description: A link, or "my own offer".
    validations: { required: true }

  - type: input
    id: verified
    attributes:
      label: When was this true?
      placeholder: "2026-08"
    validations: { required: true }

  - type: dropdown
    id: kind
    attributes:
      label: Is this new data or a re-check?
      options:
        - New salary
        - Confirming a salary on file is still accurate
        - A salary on file is wrong
    validations: { required: true }
