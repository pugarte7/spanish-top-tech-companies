<div class="card purple" id="free" style="left:330px;top:318px;font-size:44px;line-height:48px;padding:14px 24px 18px">Gratis.</div>

${TAGS.map(([, , s, c]) => `<div class="card tag ${c}">${s}</div>`).join("")}
<div class="rig"><div class="ph"><i class="btn" style="left:-3px;top:150px;height:34px"></i><i class="btn" style="left:-3px;top:200px;height:60px"></i><i class="btn" style="right:-3px;top:210px;height:92px"></i>
  <div class="scr"><div class="isl"></div><div class="stat"><span>9:41</span>${ICONS}</div>

  <div class="body">

const clamp = (x) => Math.max(0, Math.min(1, x)), ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

const sp = (t, a = 0, d = 0.5) => { const u = (t - a) / d; return u <= 0 ? 0 : 1 - Math.exp(-5 * u) * Math.cos(7 * u); };
const bump = (t, a, d = 0.4) => t > a && t < a + d ? Math.sin(Math.PI * (t - a) / d) : 0;
const pop = (el, p, extra = "") => { el.style.transform = `scale(${p}) ${extra}`; el.style.opacity = clamp(p * 4); };
const typed = (s, t, a, b) => s.slice(0, Math.round(s.length * clamp((t - a) / (b - a))));
const caret = (t) => `<span class="caret" style="opacity:${Math.floor(t * 2.5) % 2 ? 0 : 1}"></span>`;
const dots = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const all = (s, el = document) => [...el.querySelectorAll(s)];
const one = (s, el = document) => el.querySelector(s);
const lerp = (a, b, k) => a + (b - a) * k, lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const centre = (el, fx = .5, fy = .5) => { const r = el.getBoundingClientRect(); return [r.left + r.width * fx, r.top + r.height * fy]; };
// Words come up one after another; `out` (0 to 1) takes the line away.
const words = (h, t, out = 0) => {
  h.style.visibility = t > 0 && out < 1 ? "visible" : "hidden";
  all(".w", h).forEach((w, n) => { const p = sp(t, 0.04 + n * 0.08, 0.45); w.style.transform = `translateY(${(1 - p) * 26 - out * 18}px)`; w.style.opacity = clamp(p * 5) * (1 - out); });
};

// ---------- the mascot in grey 3D, put through a dot screen ----------
// Shaded in greys on a canvas nobody sees (a slab with a lit face, two glossy
// eyes, six tube arms ending in balls), then every pixel is set black or
// white against a 45 degree dot screen, as a newspaper would print it. It is
// drawn at the screen's own pixels, so it is as sharp as the frame.
const BODY = new Path2D(COAST);
// In the coast's own units (300 by 241, centre 140, 120): where each arm leaves from behind the body and where its hand idles.
const ANCH = [[90, 95], [86, 127], [96, 159], [196, 95], [200, 127], [190, 159]];
const REST = [[-44, 17], [-72, 123], [-38, 231], [344, 17], [372, 123], [338, 231]];
const cv = document.getElementById("fig"), out = cv.getContext("2d"), work = document.createElement("canvas"), wc = work.getContext("2d", { willReadFrequently: true });
cv.width = work.width = 540 * DPR; cv.height = work.height = 960 * DPR;
let last = null;
// o: x, y (the body's centre on screen), s (scale), rot (degrees), focus [x, y] the eyes follow,
// joy (eyes as ^ ^), hands {arm: [x, y] on screen}, press (0 to 1, the reaching hand squeezed).
function fig(t, o) {
  const c = wc, s = o.s, rad = o.rot * Math.PI / 180, co = Math.cos(rad), si = Math.sin(rad), bob = Math.sin(t * 3) * 3 * s;
  const at = (ux, uy) => { const dx = (ux - 140) * s, dy = (uy - 120) * s; return [o.x + dx * co - dy * si, o.y + dx * si + dy * co + bob]; };
  const anchors = ANCH.map(([x, y]) => at(x, y));
  const hands = REST.map(([x, y], i) => (o.hands && o.hands[i]) || at(x + Math.cos(t * 2.4 + i * 1.7) * 6, y + Math.sin(t * 2.9 + i * 1.3) * 7));
  // Only the part of the frame the figure covers is shaded and screened.
  const xs = [o.x - 190 * s, o.x + 190 * s, ...hands.map((h) => h[0] - 24 * s), ...hands.map((h) => h[0] + 24 * s)];
  const ys = [o.y - 160 * s, o.y + 170 * s, ...hands.map((h) => h[1] - 24 * s), ...hands.map((h) => h[1] + 24 * s)];
  const x0 = Math.max(0, Math.floor(Math.min(...xs) * DPR)), y0 = Math.max(0, Math.floor(Math.min(...ys) * DPR));
  const x1 = Math.min(cv.width, Math.ceil(Math.max(...xs) * DPR)), y1 = Math.min(cv.height, Math.ceil(Math.max(...ys) * DPR)), bw = x1 - x0, bh = y1 - y0;
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (last) { c.clearRect(...last); out.clearRect(...last); }
  last = [x0, y0, bw, bh];
  if (bw <= 0 || bh <= 0) return;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.lineCap = "round"; c.lineJoin = "round";
  hands.forEach(([hx, hy], i) => {
    const [ax, ay] = anchors[i], dx = hx - ax, dy = hy - ay, len = Math.hypot(dx, dy) || 1, bow = (16 * s + len * .13) * (i < 3 ? 1 : -1);
    const cx = ax + dx / 2 - dy / len * bow, cy = ay + dy / 2 + dx / len * bow;
    for (const [col, w, ox, oy] of [["#141414", 19, 0, 0], ["#6c6c6c", 14, -.8, -1.2], ["#cdcdcd", 6, -3, -4]]) {
      c.beginPath(); c.moveTo(ax + ox * s, ay + oy * s); c.quadraticCurveTo(cx + ox * s, cy + oy * s, hx + ox * s, hy + oy * s);
      c.strokeStyle = col; c.lineWidth = w * s * (o.hands && o.hands[i] ? 1.35 : 1); c.stroke();
    }
  });
  const eyeAt = at(132, 112), fx = o.focus ? o.focus[0] - eyeAt[0] : 0, fy = o.focus ? o.focus[1] - eyeAt[1] : 0, fd = Math.hypot(fx, fy) || 1, pull = Math.min(1, fd / 140);
  const look = { x: fx / fd * pull, y: fy / fd * pull };
  c.save();
  c.translate(o.x, o.y + bob); c.rotate(rad + look.x * .03); c.scale(s, s); c.translate(-140, -120);
  // The slab's side, away from the light, then its lit face with a rim of light and one of shadow inside the edge.
  for (let i = 15; i >= 1; i--) {
    c.save(); c.translate(i * .9, i * 1.5);
    c.fillStyle = c.strokeStyle = i > 12 ? "#0c0c0c" : "#3a3a3a"; c.lineWidth = 7; c.stroke(BODY); c.fill(BODY);
    c.restore();
  }
  const face = c.createLinearGradient(30, 0, 250, 240);
  face.addColorStop(0, "#fff"); face.addColorStop(.5, "#d9d9d9"); face.addColorStop(1, "#8f8f8f");
  c.strokeStyle = "#0c0c0c"; c.lineWidth = 7; c.stroke(BODY); c.fillStyle = face; c.fill(BODY);
  c.save(); c.clip(BODY);
  c.filter = `blur(${5 * s * DPR}px)`; c.lineWidth = 17;
  c.save(); c.translate(-6, -8); c.strokeStyle = "rgba(0,0,0,.6)"; c.stroke(BODY); c.restore();
  c.save(); c.translate(6, 8); c.strokeStyle = "#fff"; c.stroke(BODY); c.restore();
  c.filter = "none";
  c.restore();

const BIG = { x: 270, y: 640, s: 1.15, rot: 0 }, CORNER = { x: 92, y: 905, s: .82, rot: -6 }, END = { x: 270, y: 620, s: 1.1, rot: 0 }, HOVER = [296, 846];
const el = { intro: one("#intro"), free: one("#free"), caps: all(".h.cap"), tags: all(".card.tag"), rig: one(".rig"), comp: one(".comp"), compText: one(".comp > span"), send: one(".comp > b"),
  kb: one(".kb"), keys: all(".kb span"), a: one(".layer.a"), b: one(".layer.b"), c: one(".layer.c"), tap: one(".tap"), outro: one("#outro"), url: one(".card.url"), note: one(".note"), brand: one(".brand") };
const placeholder = `<span style="color:#9a9a9a">Pregunta a tu agente</span>`;

function render(t) {
  t = Math.min(t, TOTAL - 1 / 60);
  const enter = io((t - IN) / 0.9), leave = io((t - OUT) / 0.9), phoneOn = t >= IN && t < OUT + 0.9;

  // --- the opening line and its card ---
  words(el.intro, t, clamp((t - IN + 0.25) / 0.3));
  pop(el.free, sp(t, 1.3) * (1 - ease((t - IN + 0.2) / 0.25)), `rotate(${5 + Math.sin(t * 2)}deg)`);

  // --- the phone: up once, down once, still in between ---

  el.rig.style.transform = `translateY(${Math.round((1 - ease((t - IN) / 0.8)) * 820 + Math.pow(clamp((t - OUT) / 0.6), 3) * 900)}px)`;
  CAPS.forEach(([a, b], i) => words(el.caps[i], t - a, clamp((t - b + 0.2) / 0.2)));
  TAGS.forEach(([a, b, , , tilt], i) => pop(el.tags[i], sp(t, a) * (1 - ease((t - b) / 0.25)), `rotate(${tilt + Math.sin(t * 2 + i)}deg)`));

  // The composer: the link pasted, then the question typed with the keyboard up.
  const typing = t >= 7 && t < TAP.ask, kb = ease((t - 6.9) / 0.35) - ease((t - TAP.ask) / 0.35);
  el.compText.innerHTML = t >= 4.2 && t < TAP.link ? `<code style="background:rgba(0,0,242,${0.18 * (1 - clamp((t - 4.2) / 0.6))})">${URL}</code>`
    : typing ? typed(ASK, t, 7.3, 8.3) + caret(t) : placeholder;
  el.kb.style.transform = `translateY(${Math.round((1 - kb) * 330)}px)`; el.comp.style.transform = `translateY(${Math.round(-240 * kb)}px)`;
  const hit = typing && t > 7.3 && t < 8.3 ? Math.floor(t * 23) % 27 : -1;
  el.keys.forEach((k, i) => { k.style.background = i === hit ? "#abb0bc" : ""; });
  const row = all(".res", el.b)[2], yes = one(".btns span:last-child", el.c), pressed = { link: bump(t, TAP.link, 0.3), ask: bump(t, TAP.ask, 0.3), open: bump(t, TAP.open, 0.3), yes: bump(t, TAP.yes, 0.3) };
  el.send.style.transform = `scale(${1 - 0.1 * Math.max(pressed.link, pressed.ask)})`;
  yes.style.filter = `brightness(${1 - 0.25 * pressed.yes})`; yes.style.transform = `scale(${1 - 0.06 * pressed.yes})`;

  // Screen one: connected.
  const aOut = ease((t - TAP.ask) / 0.3);
  el.a.style.transform = `translateY(${-30 * aOut}px)`; el.a.style.opacity = 1 - aOut;
  pop(one(".me", el.a), sp(t, TAP.link + 0.05, 0.4)); pop(one(".tool", el.a), sp(t, 5.5, 0.4)); pop(one(".ag", el.a), sp(t, 5.9, 0.4));

  // Screen two: the postings, each with what the company pays.
  const bOut = ease((t - TAP.open - 0.15) / 0.35), n = ease((t - 9.1) / 0.8);
  el.b.style.transform = `translateX(${-340 * bOut}px)`; el.b.style.visibility = t >= TAP.ask && bOut < 1 ? "visible" : "hidden";
  pop(one(".me", el.b), sp(t, TAP.ask + 0.05, 0.4)); pop(one(".tool", el.b), sp(t, 9, 0.4));
  one(".tool span", el.b).textContent = n < 1 ? `find_jobs · ${dots(6884 + (26 - 6884) * n)} ofertas` : "find_jobs · 26 de 6.884 ofertas";
  all(".res", el.b).forEach((r, i) => {
    pop(r, sp(t, 9.6 + i * 0.15) * (r === row ? 1 - 0.04 * pressed.open : 1));
    r.style.background = r === row && t >= TAP.open ? "#e9e9ff" : "";
    pop(one("u", r), sp(t, 10 + i * 0.15, 0.4), `scale(${1 + 0.2 * bump(t, 10.9 + i * 0.22, 0.35)})`);
  });

  // Screen three: the form, the one question, the whole application and the yes.
  const cIn = ease((t - TAP.open - 0.15) / 0.35), rows = all(".row", el.c), answered = t >= 15.2, asking = t < 15.5;
  el.c.style.transform = `translateX(${340 * (1 - cIn)}px)`; el.c.style.visibility = cIn > 0 ? "visible" : "hidden";
  one(".prog i", el.c).style.width = `${80 * ease((t - 13.1) / 1.2) + 20 * ease((t - 15.2) / 0.4)}%`;
  rows.forEach((r, i) => {
    if (i < 4) return pop(one("b", r), sp(t, 13.2 + i * 0.25, 0.4));
    r.style.opacity = clamp((t - 14.3) * 5); pop(one("b", r), answered ? sp(t, 15.2, 0.4) : 0);
  });
  const ag = one(".ag", el.c), me = one(".me", el.c), box = one(".ask", el.c), done = one(".done", el.c);
  ag.style.display = me.style.display = asking ? "block" : "none"; box.style.display = asking ? "none" : "block";
  pop(ag, sp(t, 14.3, 0.4)); pop(me, sp(t, 14.6, 0.4)); me.innerHTML = typed("70.000 €", t, 14.65, 15.05) || "&nbsp;";
  box.style.opacity = clamp((t - 15.5) * 6);
  done.style.visibility = t >= TAP.yes + 0.3 ? "visible" : "hidden"; done.style.opacity = clamp((t - TAP.yes - 0.3) * 8);
  one(".lg", done).style.transform = `scale(${sp(t, TAP.yes + 0.35)})`;
  el.comp.style.opacity = 1 - cIn;

  // --- the close ---

  pop(el.url, sp(t, OUT + 0.8)); const up = sp(t, OUT + 1.3);
  el.note.style.opacity = clamp(up * 4); el.note.style.transform = `translateY(${(1 - up) * 20}px)`;
  el.brand.style.opacity = clamp((t - OUT - 1.5) * 4);

  const rest = (i) => [pose.x + (REST[i][0] - 140) * pose.s, pose.y + (REST[i][1] - 120) * pose.s];
  // Its arm reaches for each thing it presses, and waits near the screen in between.

  }

  const reach = io((t - IN - 0.5) / 0.5) * (1 - io((t - OUT + 0.3) / 0.4)), hands = {};

    focus = [270, 290];

}
window.render = render;
window.TOTAL = TOTAL;
window.CUTS = [0, IN, ...Object.values(TAP), OUT];
window.READY = Promise.all([document.fonts.load('800 60px "Inter Tight"'), document.fonts.load('700 60px "Antonio"'), document.fonts.load('400 15px "Inter Tight"')])
  .then(() => render(Number(q.get("t") || 0)));
if (q.has("play")) {
  let t0 = performance.now();
  const tick = (now) => { let t = (now - t0) / 1000; if (t >= TOTAL) { t0 = now; t = 0; } render(t); requestAnimationFrame(tick); };
  window.READY.then(() => requestAnimationFrame(tick));
}
})();
</script>
